name: Build Windows and Linux (installers, portable version, AppImage, .deb)

# Each push to main rebuilds Boofer and refreshes the GitHub release of the current version
# (tauri.conf.json → "version"): people download it ready to use, nothing to compile.
#
# windows → linux → finish, one after the other: Windows and Linux both rewrite latest.json, and
# installed copies update from it. Linux can fail without touching what Windows published:
# finish only needs Windows.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "website/**", "examples/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and the tags: the release notes are written from the commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # WiX and NSIS, downloaded by the bundler on each build otherwise: faster, and a GitHub
      # hiccup while downloading them (http 504) no longer fails the build.
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-tools-v1

      - run: npm ci

      # "What's new" of this version, from the commits since the last release (scripts/changelog.mjs).
      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<BOOFER_NOTES_END"
            node scripts/changelog.mjs --notes
            echo "BOOFER_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files: installed copies only accept updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "Boofer v__VERSION__"
          # Also the "notes" of latest.json, shown in the app before an update.
          releaseBody: |
            ## ✨ What's new
            ${{ steps.notes.outputs.body }}

            Full history: [CHANGELOG.md](https://github.com/ItzSized/Boofer/blob/main/CHANGELOG.md), or Settings → What's new in the app.

            ---
            **Windows 10 / 11**, pick one:
            - `Boofer_x.y.z_x64-setup.exe`: installer (recommended), no admin rights needed
            - `Boofer_x.y.z_x64_en-US.msi`: MSI installer, for the whole PC
            - `Boofer.exe`: portable version, nothing to install, double-click and go

            The installers add WebView2 if it's missing. Nothing else to install: no Node, no Rust.
            Already installed? Boofer updates itself (Settings → Check for updates).
            For Claude Code: Settings → Claude Code → Connect.
          # Copies that don't say how they were installed update with the setup.exe (per user, no admin).
          updaterJsonPreferNsis: true
          releaseDraft: false
          prerelease: false

      - name: Add the portable exe to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/boofer.exe Boofer.exe
          gh release upload "v$version" Boofer.exe --clobber

  linux:
    needs: windows
    runs-on: ubuntu-22.04 # the oldest glibc available: what's built here runs on newer systems
    timeout-minutes: 45 # finish waits for this job
    steps:
      - uses: actions/checkout@v4
        with:
          # changelog.mjs runs during the build (npm run build): it reads the history and the tags.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libxdo-dev libssl-dev

      - run: npm ci

      # tauri-action keeps the "platforms" of the latest.json it finds and replaces its "notes" with
      # releaseBody: given the notes Windows wrote, they don't change. The copy also serves below.
      - name: Keep what Windows wrote in latest.json
        id: windows_json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release download "v$version" -p latest.json -O "$RUNNER_TEMP/latest.json" --clobber
          {
            echo "notes<<BOOFER_NOTES_END"
            node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).notes' "$RUNNER_TEMP/latest.json"
            echo "BOOFER_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish the AppImage and the .deb
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files: installed copies only accept updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "Boofer v__VERSION__"
          releaseBody: ${{ steps.windows_json.outputs.notes }}
          # Not the targets of tauri.conf.json, which are the Windows installers.
          args: --bundles appimage,deb
          releaseDraft: false
          prerelease: false

      # tauri-action deletes latest.json before uploading the new one. If that went wrong, or the
      # run stopped in between, Windows copies must find their entry again.
      - name: Put latest.json back if the Windows entry is gone
        if: always() && steps.windows_json.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p "$RUNNER_TEMP/now"
          gh release download "v$version" -p latest.json -D "$RUNNER_TEMP/now" --clobber || true
          if ! grep -q '"windows-x86_64"' "$RUNNER_TEMP/now/latest.json"; then
            echo "::warning::latest.json lost its Windows entry: restored"
            gh release upload "v$version" "$RUNNER_TEMP/latest.json" --clobber
          fi

  # Runs when Windows succeeded, whatever happened to Linux. Not after a cancelled run: the push
  # that cancelled it is publishing again.
  finish:
    needs: [windows, linux]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same version, new commit: installed copies compare this build id with their own
      # (src-tauri/src/updates.rs) and take the new features without a new version number.
      - name: Mark latest.json with this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release download "v$version" -p latest.json -O latest.json --clobber
          node -e '
            const fs = require("fs");
            const json = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            // Every Windows copy updates from this entry: never publish a file without it.
            if (!json.platforms?.["windows-x86_64"]?.url?.endsWith("-setup.exe")) {
              throw new Error("latest.json lost its windows-x86_64 entry");
            }
            json.notes = `${(json.notes ?? "").replace(/\s*<!-- build \w+ -->\s*$/, "")}\n\n<!-- build ${process.env.GITHUB_SHA} -->`;
            fs.writeFileSync("latest.json", JSON.stringify(json, null, 2));
          '
          gh release upload "v$version" latest.json --clobber

      # tauri-action only writes the text of a release when it creates it, and the Windows job comes
      # first: Linux is added here, once its files are really there.
      - name: Add Linux to the text of the release
        if: needs.linux.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release view "v$version" --json body --jq .body > body.md
          if ! grep -q '^\*\*Linux' body.md; then
            cat >> body.md <<'BOOFER_LINUX_END'

          **Linux (x86_64, X11 or XWayland)**, pick one:
          - `Boofer_x.y.z_amd64.AppImage`: nothing to install, `chmod +x` it and run it. It updates itself.
          - `Boofer_x.y.z_amd64.deb`: `sudo apt install ./Boofer_x.y.z_amd64.deb`. It doesn't update itself: Settings → Check for updates opens the download page of a new version.

          On GNOME, the tray icon needs the "AppIndicator and KStatusNotifierItem Support" extension. Browser AIs are followed on Windows only.
          BOOFER_LINUX_END
            gh release edit "v$version" --notes-file body.md
          fi
