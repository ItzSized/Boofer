name: Build Multi-OS (Windows · macOS · Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            name: windows-x64
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macos-apple-silicon
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
            name: macos-intel
          - os: ubuntu-22.04
            args: ""
            name: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (GTK3 / WebKit2GTK / AppIndicator)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri application (${{ matrix.name }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Booffer / Boodev v__VERSION__"
          releaseBody: "Installeurs officiels pour Windows (.exe), macOS Apple Silicon & Intel (.dmg / .app) et Linux (.AppImage / .deb / .rpm)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload bundle artifacts (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
          if-no-files-found: ignore
