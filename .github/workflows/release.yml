name: Build Windows (installeur .msi, .exe et version portable)

# Each push to main rebuilds Booffer and refreshes the GitHub release of the current version
# (tauri.conf.json → "version"): people download it ready to use, nothing to compile.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "website/**", "examples/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Build and publish the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Booffer v__VERSION__"
          releaseBody: |
            **Windows 10 / 11**, au choix :
            - `Booffer_x.y.z_x64_en-US.msi` : installeur classique (recommandé)
            - `Booffer_x.y.z_x64-setup.exe` : installeur léger
            - `Booffer.exe` : version portable, rien à installer, double-clic et c'est parti
            - `Booffer-extension.zip` : l'extension pour suivre ChatGPT, Gemini, Claude, Grok… dans Chrome / Edge (déjà incluse avec les installeurs)

            Les installeurs ajoutent WebView2 s'il manque. Rien d'autre à installer : ni Node, ni Rust.
            Pour Claude Code : Réglages → Claude Code → Connecter.
          releaseDraft: false
          prerelease: false

      - name: Add the portable exe and the browser extension to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/booffer.exe Booffer.exe
          powershell -NoProfile -Command "Compress-Archive -Path extension/* -DestinationPath Booffer-extension.zip -Force"
          gh release upload "v$version" Booffer.exe Booffer-extension.zip --clobber
